<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Modern Login & Sign Up Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* Your original CSS here */
    .form-container {
      background: #fff;
      padding: 2rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 6px 40px rgba(54, 84, 99, 0.12);
      width: 340px;
      max-width: 95vw;
      position: relative;
    }
    .form {
      display: none;
      flex-direction: column;
      gap: 1rem;
      animation: fadeIn 0.5s;
    }
    .form.active {
      display: flex;
    }
    .form h2 {
      margin-bottom: 0.5rem;
      color: #5643fa;
      letter-spacing: 1px;
    }
    .form input {
      padding: 0.8rem 1rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border 0.2s;
    }
    .form input:focus {
      border: 1.5px solid #667eea;
      outline: none;
    }
    .form button {
      padding: 0.8rem;
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .form button:hover {
      background: linear-gradient(90deg, #5643fa, #667eea);
    }
    .toggle-text {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.98rem;
      color: #666;
    }
    .toggle-text span {
      color: #5643fa;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }
    .toggle-text span:hover {
      color: #764ba2;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .message-box {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #5643fa;
      color: white;
      padding: 1rem 2rem;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(86, 67, 250, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 1000;
    }
    .message-box.show {
      opacity: 1;
      pointer-events: auto;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 2rem;
      color: #5643fa;
      cursor: pointer;
      z-index: 10;
    }
    .close-btn:hover {
      color: #764ba2;
    }
    html, body {
      height: 100vh;
      margin: 0;
      background-image: url(/tejas/image/login1.jpg);
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .btn {
      padding: 15px 40px;
      border: none;
      outline: none;
      color: #FFF;
      cursor: pointer;
      position: relative;
      z-index: 0;
      border-radius: 12px;
      background: #222;
    }
    .btn::after {
      content: "";
      z-index: -1;
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #333;
      left: 0;
      top: 0;
      border-radius: 10px;
    }
    .btn::before {
      content: "";
      background: linear-gradient(
        45deg,
        #FF0000, #FF7300, #FFFB00, #48FF00,
        #00FFD5, #0028FF, #FF00C8, #FF0000
      );
      position: absolute;
      top: -2px;
      left: -2px;
      background-size: 600%;
      z-index: -1;
      width: calc(100% - 4px);
      height: calc(100% - 4px);
      filter: blur(8px);
      animation: glowing 20s linear infinite;
      transition: opacity 3s ease-in-out;
      border-radius: 10px;
      opacity: 0;
    }
    @keyframes glowing {
      0% {background-position: 0 0;}
      50% {background-position: 400% 0;}
      100% {background-position: 0 0;}
    }
    .btn:hover::before {
      opacity: 1;
    }
    .btn:active::after {
      background: transparent;
    }
    .btn:active {
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="messageBox" class="message-box"></div>
  <div class="form-container">
    <form id="loginForm" class="form active"><span class="close-btn" id="closeLogin">&times;</span>
      <h2>Login</h2>
      <input type="text" placeholder="Username or Email" required />
      <input type="password" placeholder="Password" required />
      <button class="btn" type="submit">Log In</button>
    </form>
    <p class="toggle-text">
      Don’t have an account?
      <span id="showSignup">Sign Up</span>
    </p>
    <form id="signupForm" class="form"><span class="close-btn" id="closeSignup">&times;</span>
      <h2>Sign Up</h2>
      <input type="text" placeholder="Full Name" required />
      <input type="email" placeholder="Email Address" required />
      <input type="password" placeholder="Password" required />
      <input type="password" placeholder="Confirm Password" required />
      <button class="btn" type="submit">Create Account</button>
    </form>
    <p class="toggle-text" id="backToLogin" style="display:none;">
      Already have an account?
      <span>Login</span>
    </p>
  </div>

  <script>
    const showSignup = document.getElementById('showSignup');
    const signupForm = document.getElementById('signupForm');
    const loginForm = document.getElementById('loginForm');
    const backToLogin = document.getElementById('backToLogin');
    const messageBox = document.getElementById('messageBox');

    function showMessage(msg) {
      messageBox.textContent = msg;
      messageBox.classList.add('show');
      setTimeout(() => {
        messageBox.classList.remove('show');
      }, 3000);
    }

    showSignup.onclick = function () {
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
      showSignup.parentElement.style.display = 'none';
      backToLogin.style.display = 'block';
    };

    backToLogin.onclick = function () {
      signupForm.classList.remove('active');
      loginForm.classList.add('active');
      showSignup.parentElement.style.display = 'block';
      backToLogin.style.display = 'none';
    };

    signupForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const fullName = signupForm.querySelector('input[type="text"]').value;
      const email = signupForm.querySelector('input[type="email"]').value;
      const password = signupForm.querySelectorAll('input[type="password"]')[0].value;
      const confirmPassword = signupForm.querySelectorAll('input[type="password"]')[1].value;

      if (password !== confirmPassword) {
        showMessage('Password and Confirm Password do not match!');
        return;
      }
      if (!email || password.length < 6) {
        showMessage('Please fill all fields and password must be at least 6 characters.');
        return;
      }

      // Save user data to localStorage
      localStorage.setItem('userEmail', email);
      localStorage.setItem('userPassword', password);

      showMessage('Signed up successfully');

      signupForm.classList.remove('active');
      loginForm.classList.add('active');
      showSignup.parentElement.style.display = 'block';
      backToLogin.style.display = 'none';

      // Clear inputs after sign up
      signupForm.reset();
    });

    loginForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const email = loginForm.querySelectorAll('input')[0].value;
      const password = loginForm.querySelectorAll('input')[1].value;
      const storedEmail = localStorage.getItem('userEmail');
      const storedPassword = localStorage.getItem('userPassword');

      if (email === storedEmail && password === storedPassword) {
        showMessage('Logged in successfully');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 200);
      } else {
        showMessage('Invalid email or password!');
      }
    });

    document.getElementById('closeLogin').onclick = function () {
      window.location.href = 'index.html';
    };

    document.getElementById('closeSignup').onclick = function () {
      signupForm.classList.remove('active');
      loginForm.classList.add('active');
      backToLogin.style.display = 'none';
      showSignup.parentElement.style.display = 'block';
    };
  </script>
</body>
</html>
